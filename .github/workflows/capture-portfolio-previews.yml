name: Capture portfolio previews

on:
  push:
    branches:
      - portfolio/refresh-selected-work
    paths:
      - ".github/workflows/capture-portfolio-previews.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/refresh-selected-work

      - name: Capture live project previews
        run: |
          mkdir -p public/previews
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,900 --virtual-time-budget=8000 --screenshot=public/previews/calyrn-preview.png https://calyrn.xyz
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,900 --virtual-time-budget=8000 --screenshot=public/previews/m2k-packpro-preview.png https://m2kpackpro.in

      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/previews/calyrn-preview.png public/previews/m2k-packpro-preview.png
          git diff --cached --quiet || git commit -m "chore: add live project previews"
          git push
